apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels:
    app: app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app
        image: app:1.14.2
        ports:
        - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: app-nodeport-service
spec:
  selector:
    app: app
  type: NodePort
  ports:
    - protocol: TCP
      port: 80       # 
      targetPort: 8000
      nodePort: 30007

